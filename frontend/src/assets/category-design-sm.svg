<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0E45"/>
      <stop offset="100%" stop-color="#2D1260"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="8" fill="url(#bg)"/>
  <!-- Pen tool: nib pointing down, bezier handles -->
  <g stroke="#C084FC" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- nib body -->
    <path d="M20 31 L14 22 L20 9 L26 22 Z" stroke="#C084FC" fill="none"/>
    <!-- nib tip dot -->
    <circle cx="20" cy="31" r="1.5" fill="#C084FC" stroke="none"/>
    <!-- left bezier arm -->
    <line x1="14" y1="22" x2="7" y2="18"/>
    <!-- right bezier arm -->
    <line x1="26" y1="22" x2="33" y2="18"/>
    <!-- left handle square -->
    <rect x="5" y="16" width="4" height="4" rx="1" stroke="#C084FC"/>
    <!-- right handle square -->
    <rect x="31" y="16" width="4" height="4" rx="1" stroke="#C084FC"/>
    <!-- top handle square -->
    <rect x="18" y="7" width="4" height="4" rx="1" stroke="#C084FC"/>
  </g>
</svg>
