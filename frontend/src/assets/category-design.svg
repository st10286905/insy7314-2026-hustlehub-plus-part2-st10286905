<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0820"/>
      <stop offset="50%" stop-color="#1A0E40"/>
      <stop offset="100%" stop-color="#2D1260"/>
    </linearGradient>
    <linearGradient id="sheen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B6FFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#9B6FFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <!-- diagonal sheen stripes -->
  <polygon points="220,0 400,0 400,220 100,220" fill="url(#sheen1)"/>
  <polygon points="300,0 400,0 400,220 200,220" fill="url(#sheen2)"/>
  <!-- Pen tool icon centred, large -->
  <g stroke="#C084FC" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- nib diamond -->
    <path d="M200 165 L168 115 L200 50 L232 115 Z"/>
    <!-- nib tip -->
    <circle cx="200" cy="165" r="4" fill="#C084FC" stroke="none"/>
    <!-- left bezier arm -->
    <line x1="168" y1="115" x2="130" y2="95"/>
    <!-- right bezier arm -->
    <line x1="232" y1="115" x2="270" y2="95"/>
    <!-- handle squares -->
    <rect x="121" y="86" width="18" height="18" rx="3"/>
    <rect x="261" y="86" width="18" height="18" rx="3"/>
    <rect x="191" y="41" width="18" height="18" rx="3"/>
  </g>
</svg>
